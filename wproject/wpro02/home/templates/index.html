<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>생선 품종 예측</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; }
        .form-group { margin-bottom: 12px; }
        label { display: inline-block; width: 100px; font-weight: bold; }
        input { padding: 6px; width: 180px; }
        button { padding: 8px 20px; background-color: #2c7be5; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #1a68d1; }
        .result-box { margin-top: 30px; padding: 20px; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 6px; }
        pre { background: #e9ecef; padding: 10px; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>
    <h2>생선 특성 입력</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>무게 (Weight):</label>
            <input type="number" step="any" name="weight" value="{{ weight|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>길이 (Length):</label>
            <input type="number" step="any" name="length" value="{{ length|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>대각선 (Diagonal):</label>
            <input type="number" step="any" name="diagonal" value="{{ diagonal|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>높이 (Height):</label>
            <input type="number" step="any" name="height" value="{{ height|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>넓이 (Width):</label>
            <input type="number" step="any" name="width" value="{{ width|default:'' }}" required>
        </div>
        <button type="submit">예측하기</button>
    </form>

    {% if pred_fish %}
    <div class="result-box">
        <h3>예측 생선 : {{ pred_fish }} (예측확률 : {{ max_proba }})</h3>
        <pre>{{ classes_str }}
{{ proba_str }}</pre>
        <h4>전체 확률 그래프</h4>
        <img src="data:image/png;base64,{{ graph }}" alt="예측 확률 그래프" style="max-width: 100%;">
    </div>
    {% endif %}

    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>생선 특성 입력</h2>
        <a href="{% url 'board_list' %}" style="padding: 8px 14px; background-color: #495057; color: white; text-decoration: none; border-radius: 4px; font-size: 14px;">예측 기록 게시판 보기</a>
    </div>

</body>
</html>
